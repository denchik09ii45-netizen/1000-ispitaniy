<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">

<title>1000 испытаний</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--panel2:#1d2942;--text:#f4f6fb;--muted:#aab5ca;--accent:#8b9cff;--line:#2a3854}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:calc(18px + env(safe-area-inset-top)) 16px 14px;background:linear-gradient(140deg,#202d50,#111827);position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
h1{font-size:23px;margin:0 0 4px}header p{margin:0;color:var(--muted);font-size:13px}
main{max-width:850px;margin:auto;padding:14px 12px calc(30px + env(safe-area-inset-bottom))}
.progressbox,.tools,.task,.cathead{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.progressbox{padding:14px;margin-bottom:12px}.stats{display:flex;justify-content:space-between;gap:10px;font-weight:650;font-size:14px}
progress{width:100%;height:10px;margin-top:10px;accent-color:var(--accent)}
.tools{padding:10px;display:grid;gap:9px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:44px;width:100%}
button{cursor:pointer}button:active{transform:scale(.99)}
.list{display:grid;gap:8px}.cathead{padding:12px 14px;font-weight:750;margin-top:8px}
.task{display:flex;align-items:flex-start;gap:11px;padding:12px}
.task input{width:22px;height:22px;min-height:22px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto}
.tasktext{flex:1;min-width:0;line-height:1.35}.task.done .tasktext{text-decoration:line-through;color:#8290a9}
.task small{display:block;color:var(--muted);margin-top:5px;font-size:12px}
.tag{font-size:11px;color:#c5ceff;background:#29365b;padding:3px 7px;border-radius:20px;white-space:nowrap}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{font-size:13px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 4px}
@media(min-width:650px){.tools{grid-template-columns:1fr 1fr}.task{padding:14px}}
</style>
</head>

<header><h1>🏆 Мои 1000 испытаний</h1><p>Спорт · экстрим · хобби · творчество · путешествия</p></header>
<main>
<section class="progressbox"><div class="stats"><span id="count">Выполнено: 0 / 1000</span><span id="percent">0%</span></div><progress id="bar" max="1000" value="0"></progress></section>
<section class="tools">
<input id="search" type="search" placeholder="🔎 Найти испытание..." aria-label="Поиск">
<select id="category" aria-label="Категория"><option value="">Все категории</option></select>
<select id="level" aria-label="Сложность"><option value="">Любая сложность</option><option>Лёгкий</option><option>Средний</option><option>Сложный</option></select>
<select id="status" aria-label="Статус"><option value="">Все задания</option><option value="todo">Не выполнено</option><option value="done">Выполнено</option></select>
</section>
<div id="list" class="list"></div>
<div class="actions"><button id="export">Скачать мой прогресс</button><button id="reset">Сбросить отметки</button></div>
<footer>Прогресс хранится на этом устройстве. Сохрани резервную копию кнопкой выше.<br>Экстремальные активности — только с инструктором, страховкой и подходящим допуском.</footer>
</main>

const tasks=DATA.tasks, key='my1000ProgressV1';
let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch(e){}
const $=id=>document.getElementById(id);
const cats=[...new Set(tasks.map(t=>t.category))];
cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)});
function save(){localStorage.setItem(key,JSON.stringify([...done]));updateProgress()}
function updateProgress(){let n=done.size;$('count').textContent=`Выполнено: ${n} / 1000`;$('percent').textContent=`${(n/10).toFixed(1)}%`;$('bar').value=n}
function render(){
 const q=$('search').value.trim().toLocaleLowerCase('ru'),cat=$('category').value,lev=$('level').value,st=$('status').value;
 const filtered=tasks.map((t,i)=>({...t,i})).filter(t=>(!cat||t.category===cat)&&(!lev||t.level===lev)&&(!q||(t.title+' '+t.category).toLocaleLowerCase('ru').includes(q))&&(!st||(st==='done'?done.has(t.i):!done.has(t.i))));
 const list=$('list');list.replaceChildren();let last='';
 if(!filtered.length){list.textContent='Ничего не найдено. Измени поиск или фильтры.';return}
 filtered.forEach(t=>{
  if(t.category!==last && !cat){let h=document.createElement('div');h.className='cathead';h.textContent=t.category;list.append(h);last=t.category}
  const row=document.createElement('label');row.className='task'+(done.has(t.i)?' done':'');
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=done.has(t.i);cb.setAttribute('aria-label','Отметить выполненным');
  cb.addEventListener('change',()=>{if(cb.checked)done.add(t.i);else done.delete(t.i);row.classList.toggle('done',cb.checked);save()});
  const txt=document.createElement('span');txt.className='tasktext';txt.textContent=`${t.i+1}. ${t.title}`;
  const small=document.createElement('small');small.textContent=t.category;
  const tag=document.createElement('span');tag.className='tag';tag.textContent=t.level;
  txt.append(small);row.append(cb,txt,tag);list.append(row);
 });
}
['search','category','level','status'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
$('reset').addEventListener('click',()=>{if(confirm('Снять все отметки? Это действие нельзя отменить.')){done.clear();save();render()}});
$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({done:[...done],savedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-1000-progress.json';a.click();URL.revokeObjectURL(a.href)});
updateProgress();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
